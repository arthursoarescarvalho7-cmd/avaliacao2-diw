<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Resultado</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <nav class="navbar navbar-expand-md navbar-dark bg-dark">
        <div class="container">
            <img src="img/logo-fazenda.jpg">
            <a class="navbar-brand">
                Fazenda 2026
            </a>
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">
                            Início
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="votacao.html">
                            Votar
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="resultado.html">
                            Resultado
                        </a>
                    </li>
                </ul>
            </div>
        </div>
        </nav> 
        <main class="container mt-5">
            <h1>Parcial da eliminação</h1>
            <h3 id="totalVotos">0 votos computados</h3>
            <div id="resultadoContainer"></div>
            <button class="btn btn-outline-light mt-3" data-bs-toggle="modal" data-bs-target="#modalZerar">
                Zerar votação
            </button>
        </main>
        <div class="modal fade" id="modalZerar">

            <div class="modal-dialog">

                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">
                            Confirmar exclusão
                        </h5>
                    </div>
                    <div class="modal-body">
                        Deseja realmente apagar todos os votos?
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">
                            Cancelar
                        </button>
                        <button class="btn btn-danger" onclick="zerarVotacao()">
                            Confirmar
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <script src="js/resultado.js"></script>
    </body>
</html>
